<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .box-highlight { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .box-safe { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .box-danger { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .tag { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #1e40af; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="680" fill="#f8fafc" rx="12" />

  <!-- Header -->
  <text x="500" y="38" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">TrustShop AI — Architectural Pipeline</text>
  <text x="500" y="58" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">Verified Identity Detection • Multilingual Explanations • Privacy-by-Design</text>

  <!-- 1. Input Layer -->
  <g transform="translate(40, 90)">
    <rect class="box" width="180" height="180" />
    <text x="90" y="25" text-anchor="middle" class="title">Shopper Inputs</text>
    <text x="90" y="45" text-anchor="middle" class="subtitle">Mobile Web / PWA</text>
    <line x1="20" y1="55" x2="160" y2="55" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="80" class="subtitle">• WhatsApp Phone No.</text>
    <text x="25" y="105" class="subtitle">• Raw Message Snippet</text>
    <text x="25" y="130" class="subtitle">• Seller Website Link</text>
    <text x="25" y="155" class="subtitle">• UPI ID &amp; Payee Name</text>
  </g>

  <!-- Arrow Input -> Gateway -->
  <path d="M 220 180 L 265 180" class="arrow" />

  <!-- 2. API Gateway & Normalization -->
  <g transform="translate(270, 90)">
    <rect class="box-highlight" width="180" height="180" />
    <text x="90" y="25" text-anchor="middle" class="title">API Gateway</text>
    <text x="90" y="45" text-anchor="middle" class="subtitle">FastAPI + Pydantic v2</text>
    <line x1="20" y1="55" x2="160" y2="55" stroke="#bfdbfe" stroke-width="1" />
    <text x="25" y="80" class="subtitle">• Rate Limiter (Fixed-Win)</text>
    <text x="25" y="105" class="subtitle">• E.164 Phone Normalization</text>
    <text x="25" y="130" class="subtitle">• tldextract URL Parser</text>
    <text x="25" y="155" class="subtitle">• RFC 9457 Error Shield</text>
  </g>

  <!-- Arrow Gateway -> Circuit Breakers -->
  <path d="M 450 180 L 500 180" class="arrow" />

  <!-- 3. Scorers Orchestration (Parallel with Circuit Breakers) -->
  <g transform="translate(505, 75)">
    <rect width="240" height="380" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" rx="8" />
    <text x="120" y="24" text-anchor="middle" class="title">Parallel Scorers (asyncio.gather)</text>
    <text x="120" y="38" text-anchor="middle" class="subtitle">Circuit Breakers + Per-Scorer Timeouts</text>

    <!-- Scorer 1: Brand Identity -->
    <rect x="15" y="50" class="box-highlight" width="210" height="52" />
    <text x="25" y="70" class="title" font-size="12">1. Brand Identity Scorer</text>
    <text x="25" y="88" class="subtitle">SQLite Registry Match (150ms)</text>

    <!-- Scorer 2: Payment Fuzzy -->
    <rect x="15" y="112" class="box" width="210" height="52" />
    <text x="25" y="132" class="title" font-size="12">2. Payment Entity Scorer</text>
    <text x="25" y="150" class="subtitle">RapidFuzz token_set_ratio (150ms)</text>

    <!-- Scorer 3: Message Tactic & ML -->
    <rect x="15" y="174" class="box" width="210" height="52" />
    <text x="25" y="194" class="title" font-size="12">3. Message Tactic Scorer</text>
    <text x="25" y="212" class="subtitle">Scam Regex + TF-IDF LogisticReg</text>

    <!-- Scorer 4: Domain & RDAP -->
    <rect x="15" y="236" class="box" width="210" height="52" />
    <text x="25" y="256" class="title" font-size="12">4. Domain Lookalike Scorer</text>
    <text x="25" y="274" class="subtitle">Damerau-Levenshtein + RDAP (2.5s)</text>

    <!-- Scorer 5: Number & Reports -->
    <rect x="15" y="298" class="box" width="210" height="52" />
    <text x="25" y="318" class="title" font-size="12">5. Number Reputation Scorer</text>
    <text x="25" y="336" class="subtitle">phonenumbers + HMAC Crowd Reports</text>

    <!-- Degraded Fallback -->
    <text x="120" y="368" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Degraded Mode: Never MATCHES_OFFICIAL</text>
  </g>

  <!-- Arrow Scorers -> Decision Layer -->
  <path d="M 745 265 L 785 265" class="arrow" />

  <!-- 4. Decision Engine -->
  <g transform="translate(790, 110)">
    <rect class="box" width="180" height="310" />
    <text x="90" y="25" text-anchor="middle" class="title">Decision Layer</text>
    <text x="90" y="42" text-anchor="middle" class="subtitle">Dynamic Renormalization</text>
    <line x1="15" y1="52" x2="165" y2="52" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="20" y="75" class="tag">Hard Flag Floors:</text>
    <text x="20" y="95" class="subtitle">• Channel Mismatch: 0.55</text>
    <text x="20" y="115" class="subtitle">• Personal Payee: 0.70</text>
    <text x="20" y="135" class="subtitle">• Lookalike Domain: 0.85</text>
    <text x="20" y="155" class="subtitle">• OTP / Remote App: 0.85</text>

    <line x1="15" y1="170" x2="165" y2="170" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="190" class="tag">Verdict Thresholds:</text>
    <text x="20" y="210" class="subtitle">&lt; 0.35 : UNVERIFIED</text>
    <text x="20" y="230" class="subtitle">0.35–0.65 : SUSPICIOUS</text>
    <text x="20" y="250" class="subtitle">&gt; 0.65 : LIKELY_SCAM</text>
    <text x="20" y="275" font-size="10" font-weight="700" fill="#16a34a">• MATCHES_OFFICIAL</text>
    <text x="20" y="292" font-size="9" fill="#64748b">(Only if verified &amp; fresh)</text>
  </g>

  <!-- 5. Output / Explanation Layer -->
  <g transform="translate(180, 490)">
    <rect class="box-safe" width="640" height="150" />
    <text x="320" y="28" text-anchor="middle" class="title">Explanations &amp; Actionable Outputs (i18n: EN / ML / HI)</text>
    <line x1="30" y1="40" x2="610" y2="40" stroke="#bbf7d0" stroke-width="1" />
    
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="170" height="75" fill="#ffffff" stroke="#cbd5e1" rx="6" />
      <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Clear Verdict</text>
      <text x="85" y="44" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">MATCHES OFFICIAL</text>
      <text x="85" y="62" text-anchor="middle" font-size="10" fill="#991b1b">or LIKELY SCAM</text>
    </g>

    <g transform="translate(235, 55)">
      <rect x="0" y="0" width="170" height="75" fill="#ffffff" stroke="#cbd5e1" rx="6" />
      <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Actionable Guidance</text>
      <text x="85" y="42" text-anchor="middle" font-size="10" fill="#334155">🌐 Open Official Store</text>
      <text x="85" y="62" text-anchor="middle" font-size="10" fill="#dc2626">📞 Helpline 1930 / cybercrime</text>
    </g>

    <g transform="translate(440, 55)">
      <rect x="0" y="0" width="170" height="75" fill="#ffffff" stroke="#cbd5e1" rx="6" />
      <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Observability &amp; Safety</text>
      <text x="85" y="42" text-anchor="middle" font-size="10" fill="#2563eb">🔭 OpenTelemetry + Jaeger</text>
      <text x="85" y="62" text-anchor="middle" font-size="10" fill="#64748b">🔗 SHA-256 Audit Chain</text>
    </g>
  </g>

  <!-- Connect Decision to Output -->
  <path d="M 880 420 L 880 565 L 825 565" class="arrow" />
</svg>
