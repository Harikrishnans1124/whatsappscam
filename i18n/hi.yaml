# Hindi translations for TrustShop AI
reasons:
  BRAND_CHANNEL_MATCH: "यह संपर्क विवरण ब्रांड के आधिकारिक रिकॉर्ड से मेल खाता है।"
  BRAND_CHANNEL_MISMATCH: "यह फ़ोन नंबर या वेबसाइट ब्रांड की आधिकारिक सूची में नहीं है।"
  BRAND_NOT_IN_REGISTRY: "यह ब्रांड हमारी आधिकारिक रजिस्ट्री में शामिल नहीं है। आधिकारिक स्रोतों से पुष्टि नहीं की जा सकती।"
  REGISTRY_STALE: "इस ब्रांड की रजिस्ट्री जानकारी 90 दिनों से अधिक पुरानी है और पुन: सत्यापन लंबित है।"
  REGISTRY_UNAVAILABLE: "रजिस्ट्री डेटाबेस वर्तमान में उपलब्ध नहीं है।"
  PERSONAL_PAYEE: "भुगतान प्राप्तकर्ता किसी आधिकारिक कंपनी के बजाय एक व्यक्तिगत खाता प्रतीत होता है।"
  PAYEE_NAME_MISMATCH: "प्राप्तकर्ता का नाम कंपनी के पंजीकृत कानूनी नाम से मेल नहीं खाता है।"
  PAYEE_NAME_MATCH: "प्राप्तकर्ता का नाम ब्रांड की पंजीकृत आधिकारिक कंपनी से मेल खाता है।"
  PHONE_STYLE_UPI: "यूपीआई आईडी (UPI ID) मर्चेंट आईडी के बजाय एक व्यक्तिगत मोबाइल नंबर फॉर्मेट में है।"
  OFFICIAL_DOMAIN_MATCH: "वेबसाइट डोमेन ब्रांड के आधिकारिक सत्यापित डोमेन से मेल खाता है।"
  LOOKALIKE_DOMAIN: "यह वेबसाइट आधिकारिक ब्रांड की नकल करने वाला एक अनधिकृत डोमेन है।"
  NEW_DOMAIN: "यह वेबसाइट डोमेन हाल ही में पंजीकृत किया गया है।"
  URL_SHORTENER: "असली लिंक को छिपाने के लिए URL शॉर्टनर का उपयोग किया गया है।"
  OTP_REQUEST: "संदेश में ओटीपी (OTP) मांगा जा रहा है। कोई भी वैध ब्रांड कभी आपका ओटीपी नहीं मांगता।"
  REMOTE_ACCESS_REQUEST: "संदेश में रिमोट-एक्सेस ऐप (AnyDesk, TeamViewer आदि) इंस्टॉल करने को कहा जा रहा है।"
  URGENCY_PRESSURE: "जल्दबाज़ी में भुगतान कराने का दबाव बनाया जा रहा है ('केवल आज के लिए', 'अंतिम स्टॉक')।"
  ADVANCE_PAYMENT_REQUEST: "आधिकारिक चेकआउट से बाहर अग्रिम भुगतान (Advance Payment) की मांग की जा रही है।"
  SUSPICIOUS_OFFER: "अविश्वसनीय छूट या अवास्तविक लॉटरी/पुरस्कार का दावा किया जा रहा है।"
  OFF_PLATFORM_MOVE: "आधिकारिक प्लेटफॉर्म छोड़कर व्यक्तिगत व्हाट्सएप या टेलीग्राम पर बात करने को कहा जा रहा है।"
  INVALID_PHONE_NUMBER: "फ़ोन नंबर का फॉर्मेट अंतरराष्ट्रीय मानकों के अनुसार अमान्य है।"
  REPORTED_BY_USERS: "इस संपर्क के खिलाफ कई उपयोगकर्ताओं द्वारा संदिग्ध होने की रिपोर्ट दर्ज कराई गई है।"
  RDAP_LOOKUP_FAILED: "डोमेन पंजीकरण रिकॉर्ड प्राप्त नहीं किया जा सका।"
  SCORER_UNAVAILABLE: "सत्यापन सेवा अस्थायी रूप से अनुपलब्ध है।"
  SCORER_TIMEOUT: "सत्यापन प्रक्रिया समय सीमा के भीतर पूरी नहीं हो सकी।"
  SCORER_FAILED: "सत्यापन के दौरान एक अप्रत्याशित त्रुटि आई।"
  DEGRADED_MODE: "एक या अधिक बाहरी जांचें अनुपलब्ध थीं। सावधानी बरतें।"
  ML_SCAM_LIKELY: "मशीन लर्निंग मॉडल ने इस संदेश में धोखाधड़ी की उच्च संभावना पाई है।"

summaries:
  MATCHES_OFFICIAL: "यह संपर्क {brand_name} के आधिकारिक प्रकाशित चैनलों से मेल खाता है।"
  LIKELY_SCAM: "चेतावनी: पहचान की नकल (Impersonation) के पुख्ता संकेत हैं। यह {brand_name} नहीं लगता।"
  SUSPICIOUS: "सावधान: संदिग्ध संकेत पाए गए। यह संपर्क {brand_name} के आधिकारिक रिकॉर्ड से मेल नहीं खाता।"
  UNVERIFIED: "इस विक्रेता को आधिकारिक ब्रांड चैनलों से सत्यापित नहीं किया जा सकता।"

advice:
  MATCHES_OFFICIAL:
    - "यह संपर्क आधिकारिक सत्यापित रिकॉर्ड से मेल खाता है।"
    - "फिर भी भुगतान पूरा करने से पहले {brand_name} के आधिकारिक ऐप में कार्ट और चेकआउट की पुष्टि करें।"
  LIKELY_SCAM:
    - "कोई भी धनराशि न भेजें, क्यूआर कोड स्कैन न करें और कार्ड/यूपीआई विवरण साझा न करें।"
    - "{brand_name} की आधिकारिक वेबसाइट या ऐप स्वयं खोलें और वहीं से ऑर्डर करें।"
    - "यदि आपने पहले ही पैसे भेज दिए हैं, तो तुरंत 1930 (साइबर अपराध हेल्पलाइन) पर कॉल करें और https://cybercrime.gov.in पर रिपोर्ट दर्ज करें।"
  SUSPICIOUS:
    - "इस नंबर, लिंक या पेमेंट आईडी पर अग्रिम भुगतान बिल्कुल न करें।"
    - "पुष्टि के लिए {brand_name} से उनके आधिकारिक ऐप या वेबसाइट के माध्यम से सीधे संपर्क करें।"
  UNVERIFIED:
    - "इस विक्रेता को सत्यापित या सुरक्षित न मानें।"
    - "हमेशा ब्रांड के आधिकारिक स्टोर, सत्यापित वेबसाइट या मान्यता प्राप्त ऐप से ही खरीदारी करें।"

disclaimer: "यह एक स्वचालित अनुमान है, कानूनी प्रमाण नहीं। पैसे भेजने से पहले हमेशा ब्रांड की आधिकारिक वेबसाइट या ऐप से पुष्टि करें।"
