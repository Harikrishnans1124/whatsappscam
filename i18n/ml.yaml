# Malayalam translations for TrustShop AI
reasons:
  BRAND_CHANNEL_MATCH: "ഈ കോൺടാക്റ്റ് വിവരങ്ങൾ ബ്രാൻഡിന്റെ ഔദ്യോഗിക വിവരങ്ങളുമായി പൊരുത്തപ്പെടുന്നു."
  BRAND_CHANNEL_MISMATCH: "ഈ ഫോൺ നമ്പറോ വെബ്സൈറ്റോ ബ്രാൻഡിന്റെ ഔദ്യോഗിക ലിസ്റ്റിൽ ഉള്ളതല്ല."
  BRAND_NOT_IN_REGISTRY: "ഈ ബ്രാൻഡ് ഞങ്ങളുടെ ഔദ്യോഗിക രജിസ്ട്രിയിൽ ലഭ്യമല്ല. ഔദ്യോഗിക വിവരങ്ങളുമായി ഒത്തുനോക്കാൻ സാധ്യമല്ല."
  REGISTRY_STALE: "ഈ ബ്രാൻഡിനെക്കുറിച്ചുള്ള വിവരങ്ങൾ 90 ദിവസത്തിൽ കൂടുതൽ പഴക്കമുള്ളതാണ്, പുനഃപരിശോധന ആവശ്യമാണ്."
  REGISTRY_UNAVAILABLE: "രജിസ്ട്രി വിവരങ്ങൾ നിലവിൽ ലഭ്യമാക്കാൻ കഴിഞ്ഞില്ല."
  PERSONAL_PAYEE: "പേയ്മെന്റ് സ്വീകർത്താവ് ഔദ്യോഗിക കമ്പനിയല്ല, ഒരു വ്യക്തിഗത അക്കൗണ്ടാണ്."
  PAYEE_NAME_MISMATCH: "പേയ്മെന്റ് സ്വീകർത്താവിന്റെ പേര് കമ്പനിയുടെ രജിസ്റ്റർ ചെയ്ത നിയമപരമായ പേരുമായി പൊരുത്തപ്പെടുന്നില്ല."
  PAYEE_NAME_MATCH: "പേയ്മെന്റ് സ്വീകർത്താവിന്റെ പേര് ബ്രാൻഡിന്റെ രജിസ്റ്റർ ചെയ്ത ഔദ്യോഗിക പേരുമായി പൊരുത്തപ്പെടുന്നു."
  PHONE_STYLE_UPI: "നൽകിയിരിക്കുന്ന യുപിഐ (UPI) ഐഡി ഒരു ബിസിനസ്സ് ഐഡിക്ക് പകരം വ്യക്തിഗത മൊബൈൽ നമ്പർ ഫോർമാറ്റിലാണ്."
  OFFICIAL_DOMAIN_MATCH: "വെബ്സൈറ്റ് ഡൊമൈൻ ബ്രാൻഡിന്റെ ഔദ്യോഗിക ഡൊമൈനുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു."
  LOOKALIKE_DOMAIN: "വെബ്സൈറ്റ് ഔദ്യോഗിക ബ്രാൻഡിനെ അനുകരിക്കുന്ന വ്യാജ ഡൊമൈനാണ്."
  NEW_DOMAIN: "ഈ വെബ്സൈറ്റ് ഡൊമൈൻ വളരെ അടുത്തിടെ രജിസ്റ്റർ ചെയ്തതാണ്."
  URL_SHORTENER: "യഥാർത്ഥ ലിങ്ക് മറച്ചുവെക്കാൻ യുആർഎൽ ചുരുക്കൽ (URL Shortener) ഉപയോഗിച്ചിരിക്കുന്നു."
  OTP_REQUEST: "സന്ദേശത്തിൽ ഒടിപി (OTP) ആവശ്യപ്പെടുന്നുണ്ട്. ഔദ്യോഗിക സ്ഥാപനങ്ങൾ ഒരിക്കലും ഒടിപി ചോദിക്കില്ല."
  REMOTE_ACCESS_REQUEST: "റിമോട്ട് ആക്സസ് ആപ്പുകൾ (AnyDesk, TeamViewer മുതലായവ) ഇൻസ്റ്റാൾ ചെയ്യാൻ ആവശ്യപ്പെടുന്നുണ്ട്."
  URGENCY_PRESSURE: "ഉടൻ പണം അയക്കാൻ നിർബന്ധിക്കുന്ന തന്ത്രങ്ങൾ ഉപയോഗിക്കുന്നു ('ഇന്ന് മാത്രം', 'സ്റ്റോക്ക് അവസാനിക്കുന്നു')."
  ADVANCE_PAYMENT_REQUEST: "ഔദ്യോഗിക ചെക്ക്ഔട്ടിന് പുറത്ത് മുൻകൂർ പണം ആവശ്യപ്പെടുന്നു."
  SUSPICIOUS_OFFER: "വിശ്വസിക്കാൻ പറ്റാത്ത തരത്തിലുള്ള ഓഫറുകളോ ലോട്ടറി/സമ്മാന വാഗ്ദാനങ്ങളോ നൽകുന്നു."
  OFF_PLATFORM_MOVE: "ഔദ്യോഗിക പ്ലാറ്റ്‌ഫോമിന് പുറത്ത് വ്യക്തിഗത വാട്ട്‌സ്ആപ്പിലോ ടെലിഗ്രാമിലോ ബന്ധപ്പെടാൻ ആവശ്യപ്പെടുന്നു."
  INVALID_PHONE_NUMBER: "ഫോൺ നമ്പർ അന്താരാഷ്ട്ര മാനദണ്ഡങ്ങൾ പാലിക്കുന്നില്ല."
  REPORTED_BY_USERS: "ഈ കോൺടാക്റ്റിനെതിരെ മുൻപ് ഒന്നിലധികം ആളുകൾ പരാതി നൽകിയിട്ടുണ്ട്."
  RDAP_LOOKUP_FAILED: "ഡൊമൈൻ രജിസ്ട്രേഷൻ വിവരങ്ങൾ ലഭ്യമാക്കാൻ സാധിച്ചില്ല."
  SCORER_UNAVAILABLE: "പരിശോധനാ സർവീസ് താൽക്കാലികമായി ലഭ്യമല്ല."
  SCORER_TIMEOUT: "പരിശോധന പൂർത്തിയാക്കാൻ അനുവദിച്ച സമയം കഴിഞ്ഞു."
  SCORER_FAILED: "പരിശോധനയ്ക്കിടെ അപ്രതീക്ഷിത പിശക് ഉണ്ടായി."
  DEGRADED_MODE: "ചില ബാഹ്യ പരിശോധനകൾ ലഭ്യമല്ല. ജാഗ്രത പാലിക്കുക."
  ML_SCAM_LIKELY: "മെഷീൻ ലേണിംഗ് മോഡൽ ഈ സന്ദേശത്തിൽ തട്ടിപ്പിന്റെ ഉയർന്ന സാധ്യത കണ്ടെത്തി."

summaries:
  MATCHES_OFFICIAL: "ഈ കോൺടാക്റ്റ് വിവരങ്ങൾ {brand_name}-ന്റെ ഔദ്യോഗിക ചാനലുകളുമായി പൊരുത്തപ്പെടുന്നു."
  LIKELY_SCAM: "മുന്നറിയിപ്പ്: വ്യാജമായി ആൾമാറാട്ടം നടത്തുന്നതിന്റെ ശക്തമായ ലക്ഷണങ്ങൾ കാണുന്നു. ഇത് {brand_name} അല്ല."
  SUSPICIOUS: "ശ്രദ്ധിക്കുക: സംശയാസ്പദമായ ലക്ഷണങ്ങൾ കണ്ടെത്തി. ഈ കോൺടാക്റ്റ് {brand_name}-ന്റെ ഔദ്യോഗിക വിവരങ്ങളുമായി പൊരുത്തപ്പെടുന്നില്ല."
  UNVERIFIED: "ഈ വ്യാപാരിയെ ഔദ്യോഗിക ചാനലുകളുമായി സ്ഥിരീകരിക്കാൻ സാധ്യമല്ല."

advice:
  MATCHES_OFFICIAL:
    - "നൽകിയ കോൺടാക്റ്റ് വിവരങ്ങൾ ഔദ്യോഗിക രജിസ്ട്രിയുമായി പൊരുത്തപ്പെടുന്നു."
    - "എങ്കിലും പണം നൽകുന്നതിന് മുൻപ് {brand_name}-ന്റെ ഔദ്യോഗിക ആപ്പിൽ തന്നെയെന്ന് ഉറപ്പുവരുത്തുക."
  LIKELY_SCAM:
    - "യാതൊരു കാരണവശാലും പണം അയക്കുകയോ, ക്യുആർ കോഡ് സ്കാൻ ചെയ്യുകയോ, ബാങ്ക്/യുപിഐ വിവരങ്ങൾ പങ്കിടുകയോ ചെയ്യരുത്."
    - "{brand_name}-ന്റെ ഔദ്യോഗിക വെബ്സൈറ്റോ ആപ്പോ നേരിട്ട് തുറന്ന് മാത്രം ഓർഡർ ചെയ്യുക."
    - "നിങ്ങൾക്ക് പണം നഷ്ടപ്പെട്ടിട്ടുണ്ടെങ്കിൽ, ഉടൻ 1930 എന്ന നമ്പറിലേക്ക് വിളിക്കുകയോ https://cybercrime.gov.in-ൽ പരാതിപ്പെടുകയോ ചെയ്യുക."
  SUSPICIOUS:
    - "ഈ നമ്പറിലേക്കോ ലിങ്കിലേക്കോ പേയ്മെന്റ് ഐഡിയിലേക്കോ മുൻകൂർ പണം അയക്കരുത്."
    - "സ്ഥിരീകരണത്തിനായി {brand_name}-ന്റെ ഔദ്യോഗിക ആപ്പ് അല്ലെങ്കിൽ വെബ്സൈറ്റ് വഴി നേരിട്ട് ബന്ധപ്പെടുക."
  UNVERIFIED:
    - "ഈ വ്യാപാരി സ്ഥിരീകരിക്കപ്പെട്ടയാളാണെന്ന് കരുതരുത്."
    - "എപ്പോഴും ബ്രാൻഡിന്റെ ഔദ്യോഗിക സ്റ്റോർ, വെബ്സൈറ്റ് അല്ലെങ്കിൽ ആപ്പ് വഴി മാത്രം സാധനങ്ങൾ വാങ്ങുക."

disclaimer: "ഇതൊരു ഓട്ടോമേറ്റഡ് അനുമാനം മാത്രമാണ്, നിയമപരമായ തെളിവല്ല. പണം നൽകുന്നതിന് മുൻപ് ബ്രാൻഡിന്റെ ഔദ്യോഗിക വെബ്സൈറ്റ് വഴിയോ ആപ്പ് വഴിയോ ഉറപ്പുവരുത്തുക."
