services:
  api:
    build: .
    container_name: trustshop-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/trustshop.db
      - REDIS_URL=redis://redis:6379/0
      - HMAC_SECRET=dev-secret-key-change-me
      - ADMIN_API_KEY=dev-admin-key-change-me
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=trustshop-api
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - jaeger
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trustshop-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: trustshop-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  redis_data:
